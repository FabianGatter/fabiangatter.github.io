<style>
  :root {
    --bg: #12131a; --bg2: #1b1e2c; --card: #222639; --card-edge: #151827;
    --ink: #f5f6fc; --soft: #a9aec6; --line: #343a55;
    --start: rgb(179, 77, 242); --start-edge: rgb(110, 35, 160);
    --end: rgb(26, 217, 255); --end-edge: rgb(8, 128, 160);
    --go: #62c71a; --go-edge: #3a7f0a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh; color: var(--ink); background:
      radial-gradient(1200px 600px at 10% -10%, rgba(179,77,242,.22), transparent 60%),
      radial-gradient(1000px 600px at 110% 10%, rgba(26,217,255,.18), transparent 55%),
      linear-gradient(180deg, var(--bg2), var(--bg));
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    display: flex; justify-content: center; padding: 20px 16px 32px;
  }
  main { width: 100%; max-width: 480px; }
  .brand { display: flex; align-items: center; gap: 10px; justify-content: center; margin: 4px 0 18px; font-weight: 900; letter-spacing: .5px; font-size: 22px; }
  .brand .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--start); box-shadow: 0 0 14px var(--start); }
  .brand .dot.end { background: var(--end); box-shadow: 0 0 14px var(--end); }
  .card {
    background: var(--card); border-radius: 28px; padding: 24px 20px 22px;
    box-shadow: 0 6px 0 var(--card-edge), 0 18px 40px rgba(0,0,0,.35);
    border: 1px solid rgba(255,255,255,.05);
  }
  .eyebrow { color: var(--soft); font-weight: 700; font-size: 13px; letter-spacing: 1.2px; text-transform: uppercase; text-align: center; margin: 0 0 6px; }
  h1 { font-size: 26px; line-height: 1.15; margin: 0 0 18px; text-align: center; font-weight: 900; }
  .route { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 6px; margin: 4px 0 6px; }
  .place { text-align: center; }
  .flag { font-size: 44px; line-height: 1; display: block; margin-bottom: 6px; }
  .name { font-weight: 800; font-size: 17px; }
  .place.start .name { color: var(--start); }
  .place.end .name { color: var(--end); }
  .path { width: 96px; height: 48px; }
  .forbidden { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 12px 0 0; }
  .chip { background: #2d1d24; color: #ffb3c0; border: 1px solid #5b2a37; border-radius: 999px; padding: 4px 10px; font-size: 13px; font-weight: 700; }
  .score { margin: 18px 0 4px; text-align: center; font-weight: 800; font-size: 18px; }
  .score small { display: block; color: var(--soft); font-weight: 600; font-size: 14px; margin-top: 2px; }
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%;
    padding: 16px 18px; margin-top: 14px; border-radius: 18px; text-decoration: none;
    font-weight: 900; font-size: 17px; letter-spacing: .4px; text-transform: uppercase;
    transition: transform .08s ease, box-shadow .08s ease;
  }
  .btn.primary { background: linear-gradient(180deg, #74dd2a, var(--go)); color: #0c2400; box-shadow: 0 6px 0 var(--go-edge); }
  .btn.secondary { background: linear-gradient(180deg, #41e3ff, var(--end)); color: #032530; box-shadow: 0 6px 0 var(--end-edge); }
  .btn:active { transform: translateY(5px); box-shadow: 0 1px 0 transparent; }
  .btn:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  .how { margin-top: 22px; }
  .how h2 { font-size: 17px; margin: 0 0 10px; font-weight: 900; }
  .steps { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
  .steps li { display: grid; grid-template-columns: 32px 1fr; gap: 10px; align-items: start; background: rgba(255,255,255,.04); border-radius: 16px; padding: 10px 12px; }
  .steps .n { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-weight: 900; background: var(--start); box-shadow: 0 3px 0 var(--start-edge); }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 12px; margin-top: 6px; color: var(--soft); font-size: 14px; }
  footer { text-align: center; color: var(--soft); font-size: 13px; margin-top: 22px; }
  footer a { color: var(--soft); }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: no-preference) {
    .dash { stroke-dasharray: 6 7; animation: march 1.4s linear infinite; }
    @keyframes march { to { stroke-dashoffset: -26; } }
  }
</style>
</head>
<body>
<main>

    <div class="forbidden" id="forbidden" hidden></div>
    <p class="score" id="score" hidden></p>
    <a class="btn primary" id="open" href="travle://home"></a>
    <a class="btn secondary" id="store" href="https://apps.apple.com/app/id6760892359"></a>
    <div class="how">
      <h2 id="howTitle"></h2>
      <ol class="steps">
        <li><span class="n" aria-hidden="true">1</span><span id="step1"></span></li>
        <li><span class="n" aria-hidden="true">2</span><span id="step2"></span></li>
        <li><span class="n" aria-hidden="true">3</span><span><span id="step3"></span>
          <span class="legend"><span id="lg1"></span><span id="lg2"></span><span id="lg3"></span><span id="lg4"></span></span></span></li>
      </ol>
    </div>
  </section>
  <footer>
    <a id="privacy" href="https://gist.github.com/FabianGatter/3cb34ad6c69c4fd29a9e2f348007ab87"></a> ·
    <a id="support" href="https://fabiangatter.github.io"></a>

<script>

const T = {

        beat: n => `Your friend made it in ${n} ${n === 1 ? "guess" : "guesses"}`, beatSub: "Can you beat that?", noScore: "Your friend wants to see you try!",

  sv: { eyebrow: "Väns utmaning", title: "Kan du binda ihop de här länderna?", generic: "Spela Travle", genericSub: "Det dagliga geografipusslet: koppla ihop två länder via deras grannar.",

        beat: n => `Dein:e Freund:in hat ${n} ${n === 1 ? "Versuch" : "Versuche"} gebraucht`, beatSub: "Schaffst du es besser?", noScore: "Zeig, was du kannst!",

  es: { eyebrow: "Reto de un amigo", title: "¿Puedes conectar estos países?", generic: "Juega a Travle", genericSub: "El rompecabezas geográfico diario: conecta dos países a través de sus vecinos.",

        privacy: "Privacidad", support: "Soporte" }
};
(function () {
  const lang = ((navigator.language || "en").slice(0, 2).toLowerCase());
  const t = T[lang] || T.en;
  document.documentElement.lang = T[lang] ? lang : "en";
  const set = (id, text) => { document.getElementById(id).textContent = text; };
  let regionNames = null;
  try { regionNames = new Intl.DisplayNames([document.documentElement.lang], { type: "region" }); } catch (e) {}
  const flag = a2 => a2 && a2.length === 2 ? String.fromCodePoint(...[...a2].map(c => 0x1F1E6 + c.charCodeAt(0) - 65)) : "";
  const name = id => {
    const c = C[id]; if (!c) return id;
    if (regionNames && c[1] && document.documentElement.lang !== "en") {
      try { const n = regionNames.of(c[1]); if (n && n !== c[1]) return n; } catch (e) {}
    }
    return c[0];
  };
  const code = v => { v = (v || "").toUpperCase(); return /^[A-Z]{3}$/.test(v) && C[v] ? v : null; };

  const q = new URLSearchParams(location.search);
  const s = code(q.get("s")), e = code(q.get("e"));
  const f = [...new Set((q.get("f") || "").split(",").map(code).filter(Boolean))].filter(x => x !== s && x !== e).slice(0, 3);
  const gRaw = parseInt(q.get("g") || "", 10);
  const g = Number.isInteger(gRaw) && gRaw >= 1 && gRaw <= 20 ? gRaw : null;

  set("open", "🌍  " + t.open); set("store", " " + t.store); set("howTitle", t.how);
